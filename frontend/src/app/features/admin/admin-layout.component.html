<div class="min-h-screen bg-neutral-950 text-neutral-200">
  <header class="sticky top-0 z-40 border-b border-neutral-800/70 bg-neutral-950/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3.5">
      <a routerLink="/admin/dashboard" class="group flex items-center gap-2.5">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-400 font-display text-sm font-bold text-neutral-950">AP</span>
        <span class="font-display text-sm font-semibold tracking-tight text-white">
          Portfolio <span class="text-amber-400">Admin</span>
        </span>
      </a>
      <div class="flex items-center gap-2">
        <a routerLink="/" class="btn btn-outline hidden py-1.5 sm:inline-flex">View site</a>
        <button type="button" (click)="logout()" class="btn btn-outline py-1.5">Sign out</button>
      </div>
    </div>
  </header>

  <div class="mx-auto flex w-full max-w-6xl flex-col gap-8 px-4 py-8 sm:flex-row">
    <aside class="sm:w-48 sm:shrink-0">
      <nav aria-label="Admin sections">
        <ul class="flex flex-wrap gap-1.5 sm:flex-col">
          @for (link of navLinks; track link.path) {
            <li>
              <a
                [routerLink]="link.path"
                routerLinkActive="bg-amber-500/10 text-amber-300 border-amber-500/40"
                class="block rounded-lg border border-transparent px-3 py-2 text-sm text-neutral-400 transition hover:bg-neutral-900 hover:text-white"
              >
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </aside>

    <main class="min-w-0 flex-1">
      <router-outlet />
    </main>
  </div>
</div>
